name: Rust

on:
  push:
    branches:
      - main
      - issue-1-86a20a66ea2c
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt an in-flight crates.io upload or its token revocation.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy -p grammar-expressions --all-targets --all-features

      - name: Test release decisions
        run: python3 -m unittest discover -s rust/scripts/tests -v

      - name: Check Rust file sizes
        run: bash rust/scripts/check-file-size.sh

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test -p grammar-expressions --all-features --verbose

      - name: Run doc tests
        run: cargo test -p grammar-expressions --doc --verbose

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build -p grammar-expressions --release --verbose

      - name: Verify publishable package
        run: cargo publish --manifest-path rust/Cargo.toml --locked --dry-run

  publish:
    name: Publish to crates.io
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check whether this version needs publishing
        id: release
        run: python3 rust/scripts/release-status.py

      - name: Authenticate with crates.io (OIDC first)
        if: steps.release.outputs.publish == 'true'
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      - name: Publish crate
        if: steps.release.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::crates.io authentication failed. Configure the trusted publisher for rust.yml or provide CARGO_REGISTRY_TOKEN / CARGO_TOKEN for bootstrap; see rust/README.md."
            exit 1
          fi
          cargo publish --manifest-path rust/Cargo.toml --locked
